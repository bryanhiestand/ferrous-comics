name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'  # weekly Monday UTC, catches new RustSec advisories

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: cargo-bins/cargo-binstall@5aafaaca52423a22d83a812fa3ca77492e2895db  # main
      - name: Install CI tools
        run: cargo binstall --no-confirm --force cargo-audit@0.22.1 cargo-machete@0.9.1
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo audit
      - run: cargo machete

  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc  # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Cache cargo-zigbuild
        id: cache-zigbuild
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.22.1-${{ runner.os }}
      - name: Cache zig pip download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ziglang-pip-0.15.2
      - name: Install zig
        run: pip3 install ziglang==0.15.2
      - name: Install cargo-zigbuild
        if: steps.cache-zigbuild.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-zigbuild --version 0.22.1
      - name: Build darwin-arm64
        run: cargo zigbuild --release --target aarch64-apple-darwin
